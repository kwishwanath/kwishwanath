<svg width="100%" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wishwanath Kulathunga — Director at Zetta B, Tech Lead, 15+ years shipping software">
  <defs>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d4aa" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#0b0f1a"/>

  <ellipse cx="950" cy="50" rx="340" ry="160" fill="url(#glowTeal)">
    <animate attributeName="cx" values="950;850;950" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;90;50" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="230" cy="290" rx="320" ry="150" fill="url(#glowViolet)">
    <animate attributeName="cx" values="230;340;230" dur="17s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="580" cy="20" rx="220" ry="90" fill="url(#glowViolet)" opacity="0.6">
    <animate attributeName="cx" values="580;660;580" dur="21s" repeatCount="indefinite"/>
  </ellipse>

  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#eafff9">Wishwanath <tspan fill="#00d4aa">Kulathunga</tspan></text>
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9fb3c8">Director @ Zetta B · Tech Lead · 15+ Years Shipping Software</text>
  <rect x="500" y="200" width="200" height="4" rx="2" fill="url(#underline)"/>

  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="21" text-anchor="middle">
    <text x="600" y="262" fill="#00d4aa" opacity="1">I build software that ships.<tspan fill="#7c5cff">▍<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="262" fill="#00d4aa" opacity="0">Enterprise platforms → modern web &amp; mobile apps<tspan fill="#7c5cff">▍<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="262" fill="#00d4aa" opacity="0">Architecture · Delivery · Team Leadership<tspan fill="#7c5cff">▍<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="262" fill="#00d4aa" opacity="0">AI-accelerated development<tspan fill="#7c5cff">▍<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
